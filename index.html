<script>
// Helpers
async function hashString(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    // Convert buffer to hex
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
}

// Example usage:
hashString("Valentine2026").then(hash => console.log(hash));

function str2ab(str){ return new TextEncoder().encode(str); }
function ab2hex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hex2ab(hex){ return new Uint8Array(hex.match(/.{1,2}/g).map(b=>parseInt(b,16))).buffer; }
async function sha256(str){ return ab2hex(await crypto.subtle.digest('SHA-256', str2ab(str))); }

// AES-GCM decryption
async function decryptAES(cipherHex, keyHex, ivHex){
    const key = await crypto.subtle.importKey("raw", hex2ab(keyHex), {name:"AES-GCM"}, false, ["decrypt"]);
    const decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv:hex2ab(ivHex)}, key, hex2ab(cipherHex));
    return new TextDecoder().decode(decrypted);
}
